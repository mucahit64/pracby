name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (typecheck + tests)
    runs-on: ubuntu-latest
    services:
      # Matches the test database in vitest.config.ts
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pracby_test
          POSTGRES_PASSWORD: test_pw
          POSTGRES_DB: pracby_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U pracby_test -d pracby_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Same install as the Dockerfile: the client has its own lockfile
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  client:
    name: Client (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm build
